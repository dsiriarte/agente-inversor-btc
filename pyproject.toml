[project]
name = "agente-inversor-btc"
version = "1.0.0"
description = "Agente inversor DQN sobre BTC/USD horario con evaluación en datos no vistos (Grupo 4)."
readme = "README.md"
requires-python = ">=3.12,<3.14"
dependencies = [
    "numpy==2.1.3",
    "pandas>=2.2,<4",
    "matplotlib>=3.9",
    "torch==2.11.0",
    "gymnasium==1.3.0",
    "stable-baselines3>=2.3,<3",
]

[project.optional-dependencies]
notebooks = ["jupyter>=1.1", "nbconvert>=7.16", "ipykernel>=6.29"]

[tool.uv]
package = false
